[workspace]
name = "canopy"
description = "Lab single-cell and spatial data browser (backend + frontend)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# ---------------------------------------------------------------- runtime (default)
# Version policy: lower bounds only; upper bounds/pins only with a reason comment.
[dependencies]
python = ">=3.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = ">=2.7"
anndata = ">=0.11"
h5py = ">=3.10"
zarr = ">=3.0"
numpy = ">=1.26"
scipy = ">=1.13"
pandas = ">=2.2"
pyarrow = ">=16"
spatialdata = ">=0.4"
# Used directly by canopy.synth (also pulled in by spatialdata).
dask = ">=2024.1"
geopandas = ">=0.14"
shapely = ">=2.0"
structlog = ">=24"
psutil = ">=5.9"
typer = ">=0.12"

[pypi-dependencies]
canopy = { path = ".", editable = true }

[tasks]
serve = "canopy serve"

# ---------------------------------------------------------------- dev tools
[feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
httpx2 = ">=2"  # starlette TestClient backend (httpx is deprecated there)
ruff = ">=0.6"
mypy = ">=1.11"

[feature.dev.tasks]
lint-py = "ruff check backend tests bench && ruff format --check backend tests bench"
types-py = "mypy backend/canopy"
test-py = "pytest -q tests/backend"
# Same tests, but missing example datasets fail instead of being skipped.
test-examples = { cmd = "pytest -q tests/backend", env = { CANOPY_REQUIRE_EXAMPLES = "1" } }
check-py = { depends-on = ["lint-py", "types-py", "test-py"] }
fmt = "ruff format backend tests bench && ruff check --fix backend tests bench"
install-hooks = "ln -sf ../../scripts/pre-commit .git/hooks/pre-commit"
contract-schema = "canopy contract schema --out contract/schema/manifest.schema.json"
architecture = "python scripts/architecture.py"     # docs/architecture/index.html from the code
# Benchmark fixtures (~0.5 GB each, ~1 min each) in .cache/bench; see bench/README.md
synth-bench = """
canopy synth anndata .cache/bench/synth_1m_csr.h5ad --n-obs 1000000 --n-vars 2000 --encoding csr &&
canopy synth anndata .cache/bench/synth_1m_csc.h5ad --n-obs 1000000 --n-vars 2000 --encoding csc
"""

# ---------------------------------------------------------------- frontend toolchain
[feature.frontend.dependencies]
nodejs = ">=22"
pnpm = ">=10"           # pnpm-workspace.yaml allowBuilds needs pnpm 10+

[feature.frontend.tasks]
fe-install = { cmd = "pnpm install --frozen-lockfile", cwd = "frontend" }
fe-dev = { cmd = "pnpm dev", cwd = "frontend" }
build-frontend = { cmd = "pnpm build", cwd = "frontend" }
check-fe = { cmd = "pnpm check", cwd = "frontend" }

# Browser-side contract check: write the reference store, read it with Viv + zarrita over HTTP.
[feature.dev.tasks.check-store-js]
# Viv + zarrita read the reference store served by `canopy serve` (Range requests, sharding).
cmd = "bash scripts/check-store-served.sh"

[feature.dev.tasks.check]
depends-on = ["check-py", "check-fe", "check-store-js"]

# Browser tests (Playwright, software WebGL) against `canopy serve` on the example datasets.
# Screenshots land in frontend/test-results/screens/.
[feature.dev.tasks.e2e]
cmd = "pnpm build && pnpm exec playwright test"
cwd = "frontend"

# The demo on this Mac: http://127.0.0.1:8765 on the example datasets (see docs/demo/).
[feature.dev.tasks.demo]
cmd = "bash scripts/demo.sh"

# The browser tests also on this Mac's GPU at 2x pixel density (run before a demo).
[feature.dev.tasks.e2e-gpu]
cmd = "pnpm build && pnpm exec playwright test --project gpu-2x"
cwd = "frontend"
env = { CANOPY_E2E_GPU = "1" }

# A release archive for a host (built frontend included): dist-release/canopy-<v>-<commit>.tar.gz
[feature.dev.tasks.release]
cmd = "bash scripts/release.sh"

# Everything, with the example datasets required: what to run before a demo or release.
[feature.dev.tasks.check-all]
depends-on = ["check", "test-examples", "e2e"]

[environments]
default = { solve-group = "main" }
dev = { features = ["dev", "frontend"], solve-group = "main" }
frontend = { features = ["frontend"], no-default-feature = true }
