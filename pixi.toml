[workspace]
name = "dbx"
description = "Lab single-cell and spatial data browser (backend + frontend)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# ---------------------------------------------------------------- runtime (default)
# Version policy: lower bounds only; upper bounds/pins only with a reason comment.
[dependencies]
python = ">=3.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = ">=2.7"
anndata = ">=0.11"
h5py = ">=3.10"
zarr = ">=3.0"
numpy = ">=1.26"
scipy = ">=1.13"
pandas = ">=2.2"
pyarrow = ">=16"
spatialdata = ">=0.4"
# Used directly by dbx.synth (also pulled in by spatialdata).
dask = ">=2024.1"
geopandas = ">=0.14"
shapely = ">=2.0"
structlog = ">=24"
psutil = ">=5.9"
typer = ">=0.12"

[pypi-dependencies]
dbx = { path = ".", editable = true }

[tasks]
serve = "dbx serve"

# ---------------------------------------------------------------- dev tools
[feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
httpx2 = ">=2"  # starlette TestClient backend (httpx is deprecated there)
ruff = ">=0.6"
mypy = ">=1.11"

[feature.dev.tasks]
lint-py = "ruff check backend tests bench && ruff format --check backend tests bench"
types-py = "mypy backend/dbx"
test-py = "pytest -q tests/backend"
check-py = { depends-on = ["lint-py", "types-py", "test-py"] }
fmt = "ruff format backend tests bench && ruff check --fix backend tests bench"
install-hooks = "ln -sf ../../scripts/pre-commit .git/hooks/pre-commit"
contract-schema = "dbx contract schema --out contract/schema/manifest.schema.json"
# Benchmark fixtures (~0.5 GB each, ~1 min each) in .cache/bench; see bench/README.md
synth-bench = """
dbx synth anndata .cache/bench/synth_1m_csr.h5ad --n-obs 1000000 --n-vars 2000 --encoding csr &&
dbx synth anndata .cache/bench/synth_1m_csc.h5ad --n-obs 1000000 --n-vars 2000 --encoding csc
"""

# ---------------------------------------------------------------- frontend toolchain
[feature.frontend.dependencies]
nodejs = ">=22"
pnpm = ">=10"           # pnpm-workspace.yaml allowBuilds needs pnpm 10+

[feature.frontend.tasks]
fe-install = { cmd = "pnpm install --frozen-lockfile", cwd = "frontend" }
fe-dev = { cmd = "pnpm dev", cwd = "frontend" }
build-frontend = { cmd = "pnpm build", cwd = "frontend" }
check-fe = { cmd = "pnpm check", cwd = "frontend" }

# Browser-side contract check: write the reference store, read it with Viv + zarrita over HTTP.
[feature.dev.tasks.check-store-js]
cmd = "dbx contract example .cache/example/c0 && node frontend/scripts/read-store.mjs .cache/example/c0"

[feature.dev.tasks.check]
depends-on = ["check-py", "check-fe", "check-store-js"]

[environments]
default = { solve-group = "main" }
dev = { features = ["dev", "frontend"], solve-group = "main" }
frontend = { features = ["frontend"], no-default-feature = true }
