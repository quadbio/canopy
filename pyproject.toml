[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canopy"
version = "0.0.1"
description = "Lab single-cell and spatial data browser"
requires-python = ">=3.12"
# Runtime dependencies are managed by pixi (pixi.toml); listed there with reasons for any pin.
dependencies = []

[project.scripts]
canopy = "canopy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/canopy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dask ships without type hints for dask.array constructors
module = ["canopy.synth.spatial_gen"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests/backend"]

[tool.ruff.lint.isort]
known-first-party = ["canopy"]
